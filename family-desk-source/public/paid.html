<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Payment received · HERO</title>
<style>
  :root{--bg:#1C4FA1;--card:#FFFFFF;--ink:#102B55;--muted:#5E6570;--gold:#D9A21B;color-scheme:light}
  @media (prefers-color-scheme: dark){:root{--bg:#132A52;--card:#172238;--ink:#FFFFFF;--muted:#A7B3C6;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);font:400 18px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
  main{width:100%;max-width:420px;background:var(--card);border-radius:22px;padding:30px 26px;text-align:center}
  svg{color:var(--gold)}
  h1{font:700 2rem/1.1 'Arial Narrow','Helvetica Neue',sans-serif;margin:12px 0 8px;letter-spacing:.01em}
  p{margin:0 0 10px;color:var(--muted)}
  b{color:var(--ink)}
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5 14.4 9.6 22.5 12 14.4 14.4 12 22.5 9.6 14.4 1.5 12 9.6 9.6Z" fill="currentColor"/></svg>
  <h1>Payment received</h1>
  <p><b>Thank you!</b> Your payment to Hero Training Center went through.</p>
  <p>Show this screen at the front desk, then you can close it.</p>
</main>
</body>
</html>
